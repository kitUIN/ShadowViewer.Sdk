name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (例如 1.0.0)'
        required: true
        type: string
  push:
    tags:
      - "*.*"

env:
  Solution_Name: ShadowViewer.Sdk
  Configuration: Release
  DepsUseNuget: true
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
          cache: false
      
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Use Release Tag
        run: echo "The release tag is $env:RELEASE_TAG"
        
      - name: Build Packages
        run: |
          dotnet restore $env:Solution_Name/$env:Solution_Name.csproj
          msbuild $env:Solution_Name/$env:Solution_Name.csproj -p:Configuration=$env:Configuration -p:GithubAction=true -p:DepsUseNuget=$env:DepsUseNuget
          
      - name: Copy NugetPackages to repo
        run: |
          mkdir -p NugetPackages
          cp -r ../../NugetPackages/* NugetPackages/
          Copy-Item CHANGELOG.md NugetPackages/CHANGELOG.md
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            NugetPackages/*
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./output

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: ./output/CHANGELOG.md
          files: |
            ./output/**/*.nupkg
            ./output/**/*.snupkg
          prerelease: false
          
  nuget:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./output

      - name: Push package to Nuget registry
        run: |
          $packages = Get-ChildItem -Path output -Recurse -Filter *.nupkg | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          if ($packages.Count -eq 0) { throw 'No NuGet packages were produced.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName -s 'https://api.nuget.org/v3/index.json' -k $env:NUGET_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($symbols in Get-ChildItem -Path output -Recurse -Filter *.snupkg) {
            dotnet nuget push $symbols.FullName -s 'https://api.nuget.org/v3/index.json' -k $env:NUGET_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
